name: DAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1' # Monday 08:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dast:
    name: OWASP ZAP Baseline DAST
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Start Mock HTTP Daemon
        run: |
          docker run -d --name gha-dast-target -p 8080:80 nginx:alpine
          echo "Waiting for service to be healthy..."
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "Target service is ready!"
              break
            fi
            sleep 1
          done

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false
          allow_issue_writing: false

      - name: Teardown Mock Service
        if: always()
        run: |
          docker stop gha-dast-target 2>/dev/null || true
          docker rm gha-dast-target 2>/dev/null || true
