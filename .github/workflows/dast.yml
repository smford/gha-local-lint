name: DAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1' # Monday 08:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dast:
    name: OWASP ZAP Baseline DAST
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Start Mock HTTP Daemon
        run: |
          docker run -d --name gha-dast-target -p 8080:80 nginx:alpine
          echo "Waiting for service to be healthy..."
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "Target service is ready!"
              break
            fi
            sleep 1
          done

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false
          allow_issue_writing: false

      - name: Teardown Mock Service
        if: always()
        run: |
          docker stop gha-dast-target 2>/dev/null || true
          docker rm gha-dast-target 2>/dev/null || true
