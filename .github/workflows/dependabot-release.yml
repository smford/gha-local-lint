name: Dependabot Autonomous Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  auto-patch-release:
    name: Compute SemVer Patch & Tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor == 'dependabot[bot]' || contains(github.event.head_commit.author.name, 'dependabot')
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Next SemVer Patch Version
        id: semver
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.2.0")
          echo "Latest tag: $LATEST_TAG"

          # Strip leading v
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          PATCH=$((PATCH + 1))
          NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Next tag: $NEXT_TAG"
          echo "tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Create and Push Git Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.semver.outputs.tag }}" -m "chore(release): autonomous patch release ${{ steps.semver.outputs.tag }} [skip ci]"
          git push origin "${{ steps.semver.outputs.tag }}"
