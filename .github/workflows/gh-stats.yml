name: SRE Quality Gate & Hotspots

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # Weekly Sunday 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gh-stats:
    name: SRE Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Repository Metrics & PR Quality Gate
        uses: smford/gh-stats@78262fe7ae74457ee57fb6c9bb8924b819f074d3 # v1.0.0
        with:
          fail-on: 'CRITICAL'
          comment-on-pr: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
