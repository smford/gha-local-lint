name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write
  actions: write

jobs:
  goreleaser:
    name: Production Release & Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23'
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4480b828374123cb9dbfb186fe87 # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@286f3218d700ba4501f23a1ec861535e9d424e1b # v6.0.0
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Homebrew Formula
        run: |
          scripts/generate_formula.sh "${{ github.ref_name }}" dist Formula/gha-local-lint.rb

      - name: Upload Homebrew Formula to Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" Formula/gha-local-lint.rb --clobber

      - name: Update Homebrew Tap Repository
        if: env.HOMEBREW_TOKEN != ''
        env:
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${HOMEBREW_TOKEN}@github.com/smford/homebrew-tap.git" /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Formula
          cp Formula/gha-local-lint.rb /tmp/homebrew-tap/Formula/gha-local-lint.rb
          cd /tmp/homebrew-tap
          git add Formula/gha-local-lint.rb
          if git diff --staged --quiet; then
            echo "No changes in formula."
          else
            git commit -m "feat(formula): update gha-local-lint to ${TAG_NAME}"
            git push origin main
          fi

      - name: Dispatch Documentation Deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh workflow run pages.yml -f version="${TAG_NAME}" || echo "Pages workflow trigger failed or not enabled"
