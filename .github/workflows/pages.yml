name: Deploy Pages

on:
  push:
    paths:
      - 'docs/**'
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish in documentation (e.g. v0.5.0)'
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        description: 'Release version'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build Documentation with md-web-renderer
        uses: smford/md-web-renderer@bc86d4587687ccb70f68ecc4766e72176514b596 # v1.2.2
        with:
          path: 'docs'
          title: 'gha-local-lint Documentation'
          repo-url: 'https://github.com/smford/gha-local-lint'
          upload-pages-artifact: 'false'
          fallback-readme: 'true'
          check-links: 'true'

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
