name: Deploy Pages

on:
  push:
    paths:
      - 'docs/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish in documentation (e.g. v0.2.0)'
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        description: 'Release version'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Target Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET="${INPUT_VERSION}"
          if [ -z "$TARGET" ]; then
            TARGET=$(gh release view --json tagName -q .tagName 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null || echo "v0.2.0")
          fi
          echo "tag=${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Inject Version into Documentation
        run: |
          scripts/update-docs-version.sh "${{ steps.version.outputs.tag }}" docs/index.html

      - name: Commit Updated Documentation
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No documentation changes to commit."
          else
            git commit -m "docs: update release version to ${{ steps.version.outputs.tag }} [skip ci]"
            git push origin HEAD:${{ github.ref }} || true
          fi

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
