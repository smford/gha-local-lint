name: Deploy Pages

on:
  push:
    paths:
      - 'docs/**'
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish in documentation (e.g. v0.5.0)'
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        description: 'Release version'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build Documentation with md-web-renderer
        uses: smford/md-web-renderer@bc86d4587687ccb70f68ecc4766e72176514b596 # v1.2.2
        with:
          path: 'docs'
          title: 'gha-local-lint Documentation'
          repo-url: 'https://github.com/smford/gha-local-lint'
          upload-pages-artifact: 'false'
          fallback-readme: 'true'
          check-links: 'true'

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
