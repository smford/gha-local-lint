name: SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1' # Monday 07:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4f3212b6170876c5f25241bd6e004eec44ec0312 # v3.27.1
        with:
          languages: go
          queries: security-extended

      - name: Autobuild Go Code
        uses: github/codeql-action/autobuild@4f3212b6170876c5f25241bd6e004eec44ec0312 # v3.27.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4f3212b6170876c5f25241bd6e004eec44ec0312 # v3.27.1

  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep OSS Scan
        run: semgrep scan --config auto --sarif --output semgrep.sarif

      - name: Upload Semgrep SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@4f3212b6170876c5f25241bd6e004eec44ec0312 # v3.27.1
        with:
          sarif_file: semgrep.sarif
